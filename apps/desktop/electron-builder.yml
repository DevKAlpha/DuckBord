# Installers of DuckBord for the desktop (story 27): `npm run dist -w @devbord/desktop`.
# Each system builds its own installer (CI: .github/workflows/desktop.yml).
appId: io.github.devkalpha.duckbord
productName: DuckBord
copyright: Copyright © 2026 DevKAlpha
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - web/**
  - resources/icon.png
  - package.json
# Only the languages DuckBord speaks: saves tens of MB of Chromium translations.
electronLanguages: [es, es-419, en-US, en-GB, ko]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  # Assisted installer for all users: asks for admin rights, lets the folder be changed.
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  # Default folder: C:\Program Files (x86)\DuckBord (resources/installer.nsh).
  include: resources/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DuckBord
  # Boards and the log stay in %APPDATA%\DuckBord when DuckBord is uninstalled.
  deleteAppDataOnUninstall: false
  installerLanguages: [es_ES, en_US, ko_KR]
  displayLanguageSelector: false
  artifactName: DuckBord-${version}-Windows-Setup.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: resources/icon.png
  # No Apple certificate yet: ad-hoc signature, so Apple Silicon accepts the app.
  sign:
    identity: '-'
    hardenedRuntime: false
dmg:
  artifactName: DuckBord-${version}-macOS-${arch}.${ext}

linux:
  target: [AppImage, deb]
  category: Office
  icon: resources/icon.png
  maintainer: DevKAlpha
  synopsis: Tableros Kanban para equipos técnicos y no técnicos
appImage:
  artifactName: DuckBord-${version}-Linux-${arch}.${ext}
deb:
  artifactName: DuckBord-${version}-Linux-${arch}.${ext}

publish: null
